name: Aggiornamento Mappe Meteo

on:
  schedule:
    - cron: '0 5 * * *'  # Esegue ogni giorno alle 05:00 UTC
  workflow_dispatch:      # Permette anche l'avvio manuale da GitHub

jobs:
  genera-mappe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installa dipendenze di sistema (ecCodes per GRIB)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install numpy xarray scipy netcdf4 cfgrib matplotlib cartopy requests ecmwf-opendata Pillow

      - name: Esegui script Precipitazioni 24h
        run: python precipitazioni_24.py
        env:
          CI: "true"

      - name: Esegui script Temperature al Suolo
        run: python temperature_suolo.py
        env:
          CI: "true"

      - name: Commit e Push delle nuove mappe su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add precipitazioni_multimodello/*.png *.png
          git commit -m "Aggiornamento automatico mappe meteo [skip ci]" || echo "Nessuna modifica da committare"
          git push
