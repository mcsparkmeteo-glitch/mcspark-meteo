name: McSPARK METEO - Generazione Automatica Mappe 72h

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [trigger_meteo_72h]
  workflow_dispatch:

jobs:
  run-meteo-suite:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Installa System Dependencies (eccodes per GRIB)
      run: |
        sudo apt-get update
        sudo apt-get install -y libeccodes-dev

    - name: Installa dipendenze Python
      run: |
        python -m pip install --upgrade pip
        pip install requests numpy xarray matplotlib cartopy eccodes cfgrib ecmwf-opendata scipy netcdf4 Pillow

    - name: Esegui Mappa 500 hPa
      run: |
        xvfb-run python previsioni_500.py

    - name: Esegui Mappa 850 hPa
      run: |
        xvfb-run python previsioni_850.py

    - name: Esegui Mappa MSLP
      run: |
        xvfb-run python previsione_mslp.py

    - name: Esegui Mappa Precipitazioni
      run: |
        xvfb-run python precipitazioni_totali.py

    - name: Esegui Mappa Nuvolosità 72h
      run: |
        xvfb-run python nuvolosità_72h.py

    - name: Esegui Mappa Temperature al Suolo 72h
      run: |
        xvfb-run python temperature_suolo_72h.py

    - name: Esegui Mappa Vento 72h
      run: |
        xvfb-run python vento_72h.py

    - name: Esegui Mappa Zero Termico 72h
      run: |
        xvfb-run python zero_termico_72h.py

    - name: Esegui Mappa Spessore 1000-500 hPa 72h
      run: |
        xvfb-run python spessore_gph_1000_500_72h.py

    - name: Salva e carica le mappe generate su GitHub
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git pull origin main --rebase || true
        git add .
        git diff --cached --quiet && echo "Nessuna modifica da pushare" && exit 0
        git commit -m "☁️ Aggiornamento automatico mappe meteo 72h [skip ci]"
        git push
