name: McSPARK METEO - Generazione Automatica Mappe

on:
  schedule:
    # 06:00 UTC = 08:00 ora legale italiana / 07:00 ora solare
    - cron: '0 6 * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions su GitHub

jobs:
  run-meteo-suite:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa System Dependencies (eccodes per GRIB)
      run: |
        sudo apt-get update
        sudo apt-get install -y libeccodes-dev

    - name: Installa dipendenze Python
      run: |
        python -m pip install --upgrade pip
        pip install requests numpy xarray matplotlib cartopy eccodes cfgrib ecmwf-opendata

    - name: Installa dipendenze Python
      run: |
        python -m pip install --upgrade pip
        pip install requests numpy xarray matplotlib cartopy eccodes cfgrib ecmwf-opendata scipy netcdf4
        
    - name: Esegui Mappa 500 hPa
      run: |
        xvfb-run python previsioni_500.py

    - name: Esegui Mappa 850 hPa
      run: |
        xvfb-run python previsioni_850.py

    - name: Esegui Mappa MSLP
      run: |
        xvfb-run python previsione_mslp.py

    - name: Esegui Mappa Precipitazioni
      run: |
        xvfb-run python precipitazioni_totali.py

    - name: Salva e carica le mappe generate su GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add -A
        git diff-index --quiet HEAD || (git commit -m "Auto-update mappe McSPARK METEO [skip ci]" && git pull origin main --rebase && git push)
