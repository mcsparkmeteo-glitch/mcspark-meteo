name: Aggiornamento Mappe Meteo 24h

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [trigger_meteo_24h]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genera-mappe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installa dipendenze di sistema (ecCodes per GRIB)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install numpy xarray scipy netcdf4 cfgrib matplotlib cartopy requests ecmwf-opendata Pillow

      - name: Esegui script Precipitazioni 24h
        run: python precipitazioni_24.py
        env:
          CI: "true"

      - name: Esegui script Temperature al Suolo
        run: python temperature_suolo.py
        env:
          CI: "true"

      - name: Esegui script Nuvolosità 24h
        run: python nuvolosità_24h.py
        env:
          CI: "true"

      - name: Esegui script MSLP 24h
        run: python previsione_mslp_24h.py
        env:
          CI: "true"

      - name: Esegui script Previsioni 500 hPa 24h
        run: python previsioni_500_24h.py
        env:
          CI: "true"

      - name: Esegui script Previsioni 850 hPa 24h
        run: python previsioni_850_24h.py
        env:
          CI: "true"

      - name: Esegui script Vento 24h
        run: python vento_24h.py
        env:
          CI: "true"

      - name: Esegui script Zero Termico 24h
        run: python zero_termico_24h.py
        env:
          CI: "true"

      - name: Commit e push modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Sincronizza prima di aggiungere, risolvendo eventuali conflitti a favore del nuovo
          git pull origin main --rebase -X theirs || true
          
          git add .
          git diff --cached --quiet && echo "Nessuna modifica da pushare" && exit 0
          git commit -m "☁️ Aggiornamento automatico meteo [skip ci]"
          git push
